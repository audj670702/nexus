<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="NEXUS · Conexión operativa">
  <title>NEXUS · Conexión operativa</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/nexus.css">
</head>
<body>
<div id="app" class="app-shell">
  <header class="topbar">
    <img class="brand-logo" src="./assets/logo/logo_nexus_192.png" alt="NEXUS · Conexión operativa">

    <div class="topbar-actions">
      <button id="installButton" class="install-button" type="button" data-installed="false">Instalar app</button>
      <button id="btnLogin" class="login-button" type="button">Iniciar sesión</button>
    </div>

    <button id="btnAccount" class="account-trigger" type="button" hidden aria-label="Abrir menú de cuenta" aria-expanded="false">
      <span id="topAvatar" class="account-avatar">N</span>
      <span id="topUserName" class="account-name">Usuario</span>
      <span class="account-chevron">⌄</span>
    </button>

    <aside id="accountMenu" class="account-menu" hidden>
      <div class="account-menu-identity">
        <span id="menuAvatar" class="account-avatar account-avatar-large">N</span>
        <div class="account-menu-copy">
          <strong id="menuUserName">Usuario</strong>
          <span id="menuUserEmail"></span>
        </div>
      </div>
      <nav class="account-menu-actions">
        <button type="button" data-action="profile">Editar perfil</button>
        <button type="button" data-action="subscriptions">Mis suscripciones</button>
        <button id="btnAdminPanel" type="button" data-action="admin" hidden>Panel ADM NEXUS</button>
        <button class="logout-action" type="button" data-action="logout">Cerrar sesión</button>
      </nav>
    </aside>
  </header>

  <div id="iosTutorialModal" class="ios-tutorial-modal" role="dialog" aria-modal="true" aria-label="Tutorial de instalación en iPhone" hidden>
    <div class="ios-tutorial-dialog">
      <div class="ios-tutorial-header">
        <p class="ios-tutorial-title">Instalar app en iPhone</p>
        <button id="iosTutorialClose" class="ios-tutorial-close" type="button" aria-label="Cerrar tutorial">×</button>
      </div>
      <video id="iosTutorialVideo" class="ios-tutorial-video" controls playsinline webkit-playsinline preload="metadata" disablepictureinpicture>
        <source src="./assets/instalar-app-ios.mp4" type="video/mp4">
        Tu navegador no puede reproducir este tutorial.
      </video>
    </div>
  </div>

  <main>
    <section class="context-block">
      <button id="eoIdentity" class="eo-identity" type="button" aria-label="Información del ente operador">
        <span id="eoAvatar" class="eo-avatar">EO</span>
        <span class="eo-copy">
          <span class="eo-label">ENTE OPERADOR</span>
          <strong id="eoName">Información pública</strong>
        </span>
        <span class="eo-info">+ Info</span>
      </button>
    </section>

    <div id="profileModal" class="modal-backdrop" hidden>
      <section class="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
        <button id="btnCloseProfileModal" class="modal-close" type="button" aria-label="Cerrar">×</button>
        <div class="profile-modal-head">
          <span id="profileAvatar" class="account-avatar profile-avatar">N</span>
          <div>
            <span class="profile-kicker">PERFIL</span>
            <h2 id="profileModalTitle">Editar perfil</h2>
          </div>
        </div>
        <div class="profile-form">
          <label>Nombre visible<input id="profileName" type="text" maxlength="80" autocomplete="name"></label>
          <label>Teléfono / WhatsApp<input id="profilePhone" type="tel" maxlength="30" autocomplete="tel"></label>
          <div class="profile-photo-field">
            <span class="profile-photo-label">Avatar</span>
            <input id="profileAvatarFile" class="profile-photo-input" type="file" accept="image/*">
            <div class="profile-photo-actions">
              <button id="btnChooseProfilePhoto" class="profile-photo-button" type="button">Cargar foto</button>
              <button id="btnTakeProfilePhoto" class="profile-photo-button" type="button">Tomar foto</button>
            </div>
            <span class="profile-photo-help">Selecciona una imagen del dispositivo o usa la cámara.</span>
          </div>
          <div class="profile-fixed"><span>Correo</span><strong id="profileEmail">—</strong></div>
        </div>
        <div id="profileMessage" class="profile-message" hidden></div>
        <div class="profile-actions">
          <button id="btnCancelProfile" class="profile-button secondary" type="button">Cancelar</button>
          <button id="btnSaveProfile" class="profile-button primary" type="button">Guardar</button>
        </div>
      </section>
    </div>

    <div id="eoModal" class="modal-backdrop" hidden>
      <section class="eo-modal" role="dialog" aria-modal="true" aria-labelledby="eoModalTitle">
        <button id="btnCloseEoModal" class="modal-close" type="button" aria-label="Cerrar">×</button>
        <div class="eo-modal-head">
          <span id="eoModalAvatar" class="eo-avatar eo-avatar-large">EO</span>
          <div><span class="eo-label">ENTE OPERADOR</span><h2 id="eoModalTitle">Información pública</h2></div>
        </div>
        <div id="eoModalInfo" class="eo-modal-info"></div>
      </section>
    </div>

    <section class="tv-section" aria-label="TV SCaD">
      <div class="tv-console">
        <div id="tvMonitor" class="tv-monitor"><video id="tvVideo" autoplay muted playsinline preload="auto" aria-label="Canal en vivo"></video><div id="tvPlaceholder" class="tv-placeholder"></div><div id="tvScreenCenter" class="tv-screen-center"><span class="tv-play">▶</span></div></div>
        <div class="tv-controls">
          <div class="tv-channels">
            <button class="channel is-active" type="button" data-channel="internet"><span>◉</span><span>TV Digital</span></button>
            <button class="channel" type="button" data-channel="eo"><span>▶</span><span id="eoChannelName">EO</span></button>
          </div>
          <button id="btnTvMute" class="expand-button" type="button" aria-label="Activar sonido"><span id="tvMuteIcon">🔇</span></button><button id="btnTvExpand" class="expand-button" type="button" aria-label="Ampliar TV"><span>⛶</span><span>Ampliar</span></button>
        </div>
      </div>
    </section>

    <section class="modules-section">
      <div id="modulesGrid" class="modules-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-status">
      <span id="versionLabel">NEXUS · v0.2.34</span>
      <span id="ccaLabel" class="cca">CCA · Se0 Us0 Eo0 Mns0 App0</span>
    </div>
    <span class="powered">Powered by <img src="./assets/logo/logo_hub_192x107.png" alt="SCaD HUB"></span>
  </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
