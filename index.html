<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Nexus · Conexión operativa">
  <title>Nexus · Conexión operativa</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/nexus.css">
</head>
<body>
<div id="app" class="app-shell">
  <header class="topbar">
    <div class="brand">
      <img id="nexusBrand" class="brand-logo" src="./assets/logo/logo_nexus_horizontal.jpg" alt="Nexus · Conexión operativa">
    </div>
    <button id="btnMenu" class="menu-button" type="button" aria-label="Abrir menú" aria-expanded="false">☰</button>
  </header>

  <aside id="globalMenu" class="global-menu" hidden aria-label="Menú global">
    <button type="button" data-action="home">⌂ <span>HOME</span></button>
    <button type="button" data-action="account">Mi cuenta</button>
    <button type="button" data-action="logout">Cerrar sesión</button>
  </aside>

  <main>
    <section class="context-block">
      <div class="eyebrow">MI NEXUS</div>
      <div class="context-row">
        <div class="identity" aria-label="Identidad del usuario">
          <div id="userAvatar" class="avatar" aria-hidden="true">N</div>
          <div class="identity-copy">
            <strong id="userName">Usuario</strong>
            <div id="userMeta" class="muted">Contexto pendiente</div>
          </div>
        </div>
        <div class="eo-block">
          <span class="eo-label">EO</span>
          <strong id="eoName">Entidad organizacional</strong>
        </div>
      </div>
    </section>

    <section class="tv-section" aria-labelledby="tvTitle">
      <div class="tv-title-row">
        <h2 id="tvTitle">TV SCaD</h2>
      </div>
      <div class="tv-console">
        <div id="tvMonitor" class="tv-monitor">
          <div class="tv-placeholder">TV SCaD</div>
        </div>
        <div class="tv-console-base">
          <div class="tv-channels" role="group" aria-label="Canales TV SCaD">
            <button class="channel is-active" type="button" data-channel="internet"><span aria-hidden="true">◉</span><span>TV Digital</span></button>
            <button class="channel" type="button" data-channel="eo"><span aria-hidden="true">▶</span><span id="eoChannelName">EO</span></button>
          </div>
          <button id="btnTvExpand" class="expand-button" type="button"><span aria-hidden="true">⛶</span><span>Ampliar</span></button>
        </div>
      </div>
    </section>

    <section class="modules-section" aria-labelledby="modulesTitle">
      <div class="eyebrow" id="modulesTitle">MÓDULOS</div>
      <div id="modulesGrid" class="modules-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <span>Nexus · v0.1.2</span>
    <span class="powered">Powered by <img id="hubLogo" src="./assets/logo/logo_scad-hub.png" alt="SCaD HUB"></span>
  </footer>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
