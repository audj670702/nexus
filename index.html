<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Nexus · Conexión operativa">
  <title>Nexus · Conexión operativa</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/nexus.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div id="eoName" class="eo-name">Nexus</div>
        <div class="app-subtitle">CONEXIÓN OPERATIVA</div>
      </div>
      <button id="btnMenu" class="icon-button" type="button" aria-label="Abrir menú" aria-expanded="false">☰</button>
    </header>

    <aside id="globalMenu" class="global-menu" hidden aria-label="Menú global">
      <button type="button" data-action="home">⌂ <span>HOME</span></button>
      <button type="button" data-action="account">Mi cuenta</button>
      <button type="button" data-action="logout">Cerrar sesión</button>
    </aside>

    <main>
      <section id="identityCard" class="identity" aria-label="Identidad del usuario">
        <div id="userAvatar" class="avatar" aria-hidden="true">N</div>
        <div>
          <strong id="userName">Usuario</strong>
          <div id="userMeta" class="muted">Contexto pendiente</div>
        </div>
      </section>

      <section class="tv-section" aria-labelledby="tvTitle">
        <div class="section-heading">
          <h2 id="tvTitle">TV SCaD</h2>
          <button id="btnTvExpand" class="text-button" type="button">⛶ Ampliar</button>
        </div>
        <div id="tvMonitor" class="tv-monitor">
          <div class="tv-placeholder">TV SCaD</div>
        </div>
        <div class="tv-controls" role="group" aria-label="Canales TV SCaD">
          <button class="channel is-active" type="button" data-channel="internet">TV Digital Internet</button>
          <button class="channel" type="button" data-channel="eo">Canal SCaD</button>
        </div>
      </section>

      <section aria-labelledby="modulesTitle">
        <h2 id="modulesTitle">Módulos</h2>
        <div id="modulesGrid" class="modules-grid"></div>
      </section>
    </main>

    <footer class="footer">Nexus · v0.1.0</footer>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
