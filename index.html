<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Nexus · Conexión operativa">
  <title>Nexus · Conexión operativa</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/nexus.css">
</head>
<body>
<div id="app" class="app-shell">
  <header class="topbar">
    <div class="brand">
      <img id="nexusBrand" class="brand-logo" src="./assets/logo/logo_nexus_horizontal.png" alt="Nexus · Conexión operativa">
    </div>

    <button id="btnLogin" class="login-button" type="button">Iniciar sesión</button>

    <button id="btnAccount" class="account-trigger" type="button" hidden aria-label="Abrir menú de cuenta" aria-expanded="false">
      <span id="topAvatar" class="account-avatar" aria-hidden="true">N</span>
      <span id="topUserName" class="account-name">Usuario</span>
      <span class="account-chevron" aria-hidden="true">⌄</span>
    </button>

    <aside id="accountMenu" class="account-menu" hidden aria-label="Menú de cuenta">
      <div class="account-menu-identity">
        <span id="menuAvatar" class="account-avatar account-avatar-large" aria-hidden="true">N</span>
        <div>
          <strong id="menuUserName">Usuario</strong>
          <div id="menuUserEmail" class="account-email"></div>
        </div>
      </div>
      <div class="account-menu-actions">
        <button type="button" data-action="profile">Editar perfil</button>
        <button type="button" data-action="subscriptions">Mis suscripciones</button>
        <button id="btnAdminPanel" type="button" data-action="admin" hidden>Panel de administración NEXUS</button>
        <button type="button" data-action="logout">Cerrar sesión</button>
      </div>
    </aside>
  </header>

  <main>
    <section class="context-block">
      <div class="eyebrow">MI NEXUS</div>
      <div class="context-row">
        <div class="visitor-copy">
          <strong id="contextTitle">Explora NEXUS</strong>
          <div id="contextMeta" class="muted">Inicia sesión para acceder a tus recursos operativos.</div>
        </div>
        <div class="eo-block">
          <span class="eo-label">EO</span>
          <strong id="eoName">Información pública</strong>
        </div>
      </div>
    </section>

    <section class="tv-section" aria-labelledby="tvTitle">
      <div class="tv-title-row"><h2 id="tvTitle">TV SCaD</h2></div>
      <div class="tv-console">
        <div id="tvMonitor" class="tv-monitor"><div class="tv-placeholder">TV SCaD</div></div>
        <div class="tv-console-base">
          <div class="tv-channels" role="group" aria-label="Canales TV SCaD">
            <button class="channel is-active" type="button" data-channel="internet"><span aria-hidden="true">◉</span><span>TV Digital</span></button>
            <button class="channel" type="button" data-channel="eo"><span aria-hidden="true">▶</span><span id="eoChannelName">EO</span></button>
          </div>
          <button id="btnTvExpand" class="expand-button" type="button"><span aria-hidden="true">⛶</span><span>Ampliar</span></button>
        </div>
      </div>
    </section>

    <section class="modules-section" aria-labelledby="modulesTitle">
      <div class="eyebrow" id="modulesTitle">MÓDULOS</div>
      <div id="modulesGrid" class="modules-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <span>Nexus · v0.2.0</span>
    <span class="powered">Powered by <img id="hubLogo" src="./assets/logo/logo_hub_scad.png" alt="SCaD HUB"></span>
  </footer>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
